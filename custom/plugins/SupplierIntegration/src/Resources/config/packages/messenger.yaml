framework:
    messenger:
        failure_transport: failed
        transports:
            supplier_sync:
                dsn: 'doctrine://default?queue_name=supplier_sync'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed'
        routing:
            'SupplierIntegration\Message\StartSupplierSyncMessage': supplier_sync
