name: ERP Connector - unit and static analysis

on:
  push:
    branches: [feature/erp-connector-hardening-roadmap]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  erp-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate plugin PHP syntax
        run: |
          find custom/plugins/TechPartsErpConnector/src custom/plugins/TechPartsErpConnector/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: vendor/bin/phpunit --configuration=phpunit.dist.xml custom/plugins/TechPartsErpConnector/tests/Unit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress
