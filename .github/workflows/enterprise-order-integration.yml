name: Enterprise Order Integration

on:
  pull_request:
    paths:
      - 'custom/plugins/EnterpriseOrderIntegration/**'
      - '.github/workflows/enterprise-order-integration.yml'
  push:
    branches:
      - 'feature/SW-200-enterprise-order-integration'
    paths:
      - 'custom/plugins/EnterpriseOrderIntegration/**'
      - '.github/workflows/enterprise-order-integration.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          find custom/plugins/EnterpriseOrderIntegration -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
      - name: Validate JSON fixtures and Administration snippets
        shell: bash
        run: |
          set -euo pipefail
          find custom/plugins/EnterpriseOrderIntegration -name '*.json' -print0 | while IFS= read -r -d '' file; do
            php -r '$data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done
      - name: Validate plugin XML
        shell: bash
        run: |
          php -r 'foreach (glob("custom/plugins/EnterpriseOrderIntegration/src/Resources/config/*.xml") as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: ".$file.PHP_EOL); exit(1); } }'
